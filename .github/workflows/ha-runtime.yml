name: ha-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ha-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: '2025.2.0'
            python: '3.13'
            harness: '0.13.210'
          - core: '2026.10.1'
            python: '3.14'
            harness: '0.13.372'
          - core: '2026.10.0b7'
            python: '3.14'
            harness: '0.13.372'
            override_core: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test harness
        run: |
          pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}"
          # The newest upstream fixtures pin stable HA. Exercise the real latest
          # published beta explicitly, retaining its real version assertion.
          if [ '${{ matrix.override_core }}' = 'true' ]; then
            pip install 'homeassistant==${{ matrix.core }}'
          fi
          python - <<'PYVER'
          from homeassistant.const import __version__
          assert __version__ == '${{ matrix.core }}', __version__
          PYVER
          # Requirements of the core integrations this integration depends on
          # (frontend serves the panel; panel_custom needs it).
          pip install $(python - <<'PY'
          import json, os, homeassistant
          base = os.path.join(os.path.dirname(homeassistant.__file__), "components")
          reqs = set()
          for name in ("frontend", "http", "lovelace", "panel_custom", "websocket_api"):
              reqs.update(json.load(open(os.path.join(base, name, "manifest.json"))).get("requirements", []))
          print(" ".join(sorted(reqs)))
          PY
          )
      - name: Integration inside a real Home Assistant core
        run: python -m pytest tests_ha -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -p no:cacheprovider
